services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime_wiki_app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: anime_wiki
      DB_USER: root
      DB_PASSWORD: root
      APP_DISABLE_CACHE: "true"
    volumes:
      - ./src/main/webapp:/opt/dev-webapp:ro
    networks:
      - anime_wiki_net

  mysql:
    image: mysql:8.0
    container_name: anime_wiki_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anime_wiki
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anime_wiki_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: anime_wiki_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - anime_wiki_net

volumes:
  mysql_data:

networks:
  anime_wiki_net:
    driver: bridge
