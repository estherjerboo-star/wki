<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar cuenta | Los tres grandes del anime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Assets/img/logo-circle.png">
    <link rel="stylesheet" href="Assets/css/login.css">
</head>
<body class="auth-manga-page">
    <div class="login-container">
        <section class="login-box recover-box">
            <p class="login-kicker">Recuperacion</p>
            <h1>Recupera tu cuenta</h1>
            <p id="recoverIntro">Busca tu correo y cambia la contrasena con el mismo estilo de la portada principal.</p>

            <form id="checkAccountForm" method="POST">
                <div class="input-group">
                    <label for="recoverEmail">Correo electronico</label>
                    <input type="email" id="recoverEmail" placeholder="tu@correo.com" required>
                </div>

                <button type="submit" class="btn-login">Buscar cuenta</button>
            </form>

            <form id="resetPasswordForm" class="hidden" method="POST">
                <div class="account-found" id="accountFound"></div>

                <div class="input-group">
                    <label for="newPassword">Nueva contrasena</label>
                    <input type="password" id="newPassword" placeholder="********" minlength="6" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirmar contrasena</label>
                    <input type="password" id="confirmPassword" placeholder="********" minlength="6" required>
                </div>

                <button type="submit" class="btn-login">Cambiar contrasena</button>
            </form>

            <p id="recoverMessage" class="error-text recover-message" aria-live="polite"></p>

            <div class="extra-links">
                <a id="backToLoginLink" href="login.html">Volver al login</a>
                <a href="register.html">Crear cuenta</a>
            </div>
        </section>
    </div>

    <script src="Assets/js/auth-helper.js"></script>
    <script src="Assets/js/forgot-password.js"></script>
</body>
</html>
