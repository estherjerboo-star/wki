<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta | Los tres grandes del anime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Assets/img/logo-circle.png">
    <link rel="stylesheet" href="Assets/css/login.css">
</head>
<body class="auth-manga-page">
    <div class="login-container">
        <section class="login-box">
            <p class="login-kicker">Registro anime</p>
            <h1>Crea tu cuenta</h1>
            <p>Registra tu usuario para entrar directamente a la wiki de One Piece, Naruto y Bleach.</p>

            <form id="registroForm" method="POST">
                <div class="input-group">
                    <label for="nombre">Usuario</label>
                    <input type="text" id="nombre" placeholder="Tu nombre de usuario" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo electronico</label>
                    <input type="email" id="email" placeholder="tu@correo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contrasena</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <div class="input-group">
                    <label for="confirm">Confirmar contrasena</label>
                    <input type="password" id="confirm" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Crear cuenta y entrar</button>

                <p id="error" class="error-text"></p>

                <div class="extra-links">
                    <a href="login.html">Ya tienes cuenta? Inicia sesion</a>
                    <a href="index.html">Volver al inicio</a>
                </div>
            </form>
        </section>
    </div>

    <script src="Assets/js/auth-helper.js"></script>
    <script src="Assets/js/register.js"></script>
</body>
</html>
