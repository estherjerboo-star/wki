<svg width="390" height="1900" viewBox="0 0 390 1900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(195 0) rotate(90) scale(1080 430)">
      <stop stop-color="#203044"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#E2AA2F"/>
    </linearGradient>
    <linearGradient id="cover" x1="15" y1="220" x2="375" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173146"/>
      <stop offset="0.48" stop-color="#2D4658"/>
      <stop offset="1" stop-color="#111A24"/>
    </linearGradient>
  </defs>

  <rect width="390" height="1900" fill="#E6E6E6"/>
  <rect width="390" height="1900" fill="url(#bg)"/>
  <rect width="390" height="1900" fill="#03070B" opacity="0.25"/>

  <rect width="390" height="177" fill="#050A10" fill-opacity="0.95"/>
  <line x1="0" y1="176.5" x2="390" y2="176.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <circle cx="31" cy="28" r="18" fill="#0D1722" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="31" cy="28" r="13" fill="url(#gold)"/>
  <text x="25" y="34" fill="#101214" font-family="Inter" font-size="14" font-weight="900">3</text>
  <text x="57" y="24" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">Los tres grandes</text>
  <text x="57" y="43" fill="#D0C5B0" font-family="Inter" font-size="11">Anime wiki fan</text>

  <g font-family="Inter" font-size="13" font-weight="600">
    <text x="19" y="90" fill="#D0C5B0">Portada</text>
    <rect x="88" y="68" width="88" height="34" rx="17" fill="#E2AA2F" fill-opacity="0.18" stroke="#C5A65C" stroke-opacity="0.35"/>
    <text x="105" y="90" fill="#F4EFE4">One Piece</text>
    <text x="189" y="90" fill="#D0C5B0">Naruto</text>
    <text x="253" y="90" fill="#D0C5B0">Bleach</text>
  </g>

  <rect x="15" y="116" width="360" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="39" cy="139" r="17" fill="url(#gold)"/>
  <text x="33" y="145" fill="#101214" font-family="Inter" font-size="16" font-weight="900">K</text>
  <text x="69" y="133" fill="#D0C5B0" font-family="Inter" font-size="10">Bienvenido</text>
  <text x="69" y="150" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">kurosaki</text>
  <text x="352" y="146" fill="#D0C5B0" font-family="Inter" font-size="20" font-weight="900">+</text>

  <rect x="4" y="188" width="382" height="450" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="15" y="216" width="360" height="178" rx="16" fill="url(#cover)" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="34" y="254" fill="#D0C5B0" font-family="Inter" font-size="13" font-weight="700">Imagen: Arcos de One Piece</text>
  <text x="34" y="292" fill="#F4EFE4" font-family="Playfair Display" font-size="31" font-weight="800">Sagas y arcos del viaje</text>
  <text x="34" y="324" fill="#D0C5B0" font-family="Inter" font-size="13">East Blue, Grand Line, Nuevo Mundo y Saga Final.</text>
  <circle cx="290" cy="300" r="42" fill="#E2AA2F" fill-opacity="0.14" stroke="#E2AA2F" stroke-opacity="0.4"/>
  <text x="268" y="306" fill="#F4EFE4" font-family="Playfair Display" font-size="16" font-weight="800">Arcos</text>

  <text x="19" y="436" fill="#E2AA2F" font-family="Inter" font-size="11" font-weight="800" letter-spacing="3">ONE PIECE</text>
  <text x="19" y="476" fill="#F4EFE4" font-family="Playfair Display" font-size="31" font-weight="800">Arcos de One Piece</text>
  <text x="19" y="520" fill="#D0C5B0" font-family="Inter" font-size="14">
    <tspan x="19" dy="0">One Piece se organiza en sagas y arcos que muestran como Luffy</tspan>
    <tspan x="19" dy="23">pasa de pirata novato a figura capaz de sacudir el mundo.</tspan>
  </text>
  <text x="19" y="590" fill="#E2AA2F" font-family="Inter" font-size="14" font-weight="800">Volver a One Piece</text>

  <rect x="4" y="662" width="382" height="286" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="19" y="686" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="730" fill="#E2AA2F" font-family="Playfair Display" font-size="34" font-weight="800">11</text>
  <text x="105" y="713" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">Sagas principales</text>
  <text x="105" y="740" fill="#D0C5B0" font-family="Inter" font-size="13">Desde East Blue hasta la Saga Final.</text>

  <rect x="19" y="774" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="818" fill="#E2AA2F" font-family="Playfair Display" font-size="34" font-weight="800">33</text>
  <text x="113" y="801" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">Arcos destacados</text>
  <text x="113" y="828" fill="#D0C5B0" font-family="Inter" font-size="13">La evolucion de la tripulacion.</text>

  <rect x="19" y="862" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="906" fill="#E2AA2F" font-family="Playfair Display" font-size="34" font-weight="800">2</text>
  <text x="105" y="889" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">Grandes etapas</text>
  <text x="105" y="916" fill="#D0C5B0" font-family="Inter" font-size="13">Antes del timeskip y Nuevo Mundo.</text>

  <rect x="4" y="972" width="382" height="516" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="19" y="1012" fill="#E2AA2F" font-family="Inter" font-size="11" font-weight="800" letter-spacing="3">GUIA GENERAL</text>
  <text x="19" y="1052" fill="#F4EFE4" font-family="Playfair Display" font-size="27" font-weight="800">Como se construye la aventura de Luffy</text>
  <text x="19" y="1094" fill="#D0C5B0" font-family="Inter" font-size="13">
    <tspan x="19" dy="0">Los arcos no solo encadenan combates. Cada uno presenta un</tspan>
    <tspan x="19" dy="22">problema local conectado con algo mayor: Gobierno Mundial,</tspan>
    <tspan x="19" dy="22">Yonkos, poneglyphs, Siglo Vacio o libertad.</tspan>
  </text>

  <rect x="19" y="1188" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1217" fill="#E2AA2F" font-family="Inter" font-size="11" font-weight="800">SAGA EAST BLUE</text>
  <text x="40" y="1245" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">Los origenes del Sombrero de Paja</text>

  <rect x="19" y="1278" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1307" fill="#E2AA2F" font-family="Inter" font-size="11" font-weight="800">SAGA ARABASTA</text>
  <text x="40" y="1335" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">La entrada real a la Grand Line</text>

  <rect x="19" y="1368" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1397" fill="#E2AA2F" font-family="Inter" font-size="11" font-weight="800">SAGA WATER 7</text>
  <text x="40" y="1425" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">La tripulacion se rompe</text>

  <rect x="4" y="1512" width="382" height="274" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="19" y="1552" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="800">Claves para entender los arcos</text>
  <text x="19" y="1600" fill="#D0C5B0" font-family="Inter" font-size="13">• Cada saga agrupa arcos conectados por un conflicto mayor.</text>
  <text x="19" y="1630" fill="#D0C5B0" font-family="Inter" font-size="13">• Las islas reflejan libertad, justicia, racismo o herencia.</text>
  <text x="19" y="1660" fill="#D0C5B0" font-family="Inter" font-size="13">• Arlong Park, Enies Lobby y Marineford son decisivos.</text>

  <rect x="19" y="1700" width="352" height="58" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="40" y="1724" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">Metadatos</text>
  <text x="40" y="1748" fill="#D0C5B0" font-family="Inter" font-size="12">One Piece · Arcos · 11 sagas · 33 arcos</text>

  <rect x="24" y="1828" width="90" height="36" rx="18" fill="#0C151F" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="41" y="1851" fill="#F4EFE4" font-family="Inter" font-size="13" font-weight="800">♟ Audio</text>
  <circle cx="342" cy="1836" r="20" fill="url(#gold)"/>
  <text x="335" y="1844" fill="#101214" font-family="Inter" font-size="18" font-weight="900">↑</text>
</svg>
