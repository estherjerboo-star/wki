<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 300) rotate(90) scale(760 1040)">
      <stop stop-color="#1A2A3B"/>
      <stop offset="0.55" stop-color="#07101A"/>
      <stop offset="1" stop-color="#04070D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F2CF78"/>
      <stop offset="1" stop-color="#D9B15F"/>
    </linearGradient>
    <linearGradient id="mangaLeft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263A4B"/>
      <stop offset="1" stop-color="#0B121B"/>
