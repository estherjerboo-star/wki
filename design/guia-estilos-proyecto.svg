<svg width="1647" height="2200" viewBox="0 0 1647 2200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(824 0) rotate(90) scale(1500 1450)">
      <stop stop-color="#1B2A3D"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
    <linearGradient id="onePiece" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#E2AA2F"/>
    </linearGradient>
    <linearGradient id="naruto" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#F18F3B"/>
    </linearGradient>
    <linearGradient id="bleach" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#7AC7DD"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="36" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1647" height="2200" fill="#E6E6E6"/>
  <rect x="48" y="48" width="1551" height="2104" rx="32" fill="url(#bg)"/>
  <rect x="48" y="48" width="1551" height="2104" rx="32" fill="#03070B" opacity="0.22"/>

  <text x="96" y="136" fill="#D6A84F" font-family="Inter" font-size="18" font-weight="800" letter-spacing="4">GUIA DE ESTILOS</text>
  <text x="96" y="206" fill="#F4EFE4" font-family="Playfair Display" font-size="68" font-weight="800">Los tres grandes del anime</text>
  <text x="96" y="254" fill="#D0C5B0" font-family="Inter" font-size="24">Sistema visual del proyecto real para llevarlo a Figma.</text>

  <g filter="url(#shadow)">
    <rect x="96" y="320" width="1455" height="230" rx="28" fill="#0C151F" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="136" y="374" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">IDENTIDAD</text>
    <text x="136" y="426" fill="#F4EFE4" font-family="Playfair Display" font-size="40" font-weight="800">Wiki fan oscura, elegante y visual</text>
    <text x="136" y="478" fill="#D0C5B0" font-family="Inter" font-size="20">
      <tspan x="136" dy="0">El proyecto es una wiki de anime sobre One Piece, Naruto y Bleach. Usa una estética oscura con paneles azul-negro,</tspan>
      <tspan x="136" dy="32">bordes suaves, imágenes de anime, botones dorados y títulos serif grandes para dar sensación de enciclopedia premium.</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="600" width="704" height="440" rx="28" fill="#0C151F" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="136" y="654" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">TIPOGRAFIA REAL</text>
    <text x="136" y="710" fill="#F4EFE4" font-family="Playfair Display" font-size="44" font-weight="800">Fuentes del proyecto</text>
    <text x="136" y="770" fill="#D0C5B0" font-family="Inter" font-size="20">
      <tspan x="136" dy="0">Fuente real para textos normales:</tspan>
      <tspan x="136" dy="34" fill="#F4EFE4">"Segoe UI", Arial, sans-serif</tspan>
    </text>
    <text x="136" y="868" fill="#D0C5B0" font-family="Inter" font-size="20">
      <tspan x="136" dy="0">Fuente real para titulos:</tspan>
      <tspan x="136" dy="34" fill="#F4EFE4">Georgia, "Times New Roman", serif</tspan>
    </text>
    <text x="136" y="964" fill="#D6A84F" font-family="Inter" font-size="18" font-weight="800">En Figma usar similares: Playfair Display para titulos e Inter para texto normal.</text>

    <text x="860" y="654" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">EJEMPLOS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="846" y="600" width="705" height="440" rx="28" fill="#0C151F" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="890" y="704" fill="#F4EFE4" font-family="Playfair Display" font-size="54" font-weight="800">Titulo Georgia real</text>
    <text x="890" y="770" fill="#D0C5B0" font-family="Inter" font-size="22">Texto normal con Segoe UI en el proyecto real.</text>
    <text x="890" y="828" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">EYEBROW / ETIQUETA</text>
    <text x="890" y="884" fill="#F4EFE4" font-family="Playfair Display" font-size="32" font-weight="800">Subtitulo de sección</text>
    <text x="890" y="932" fill="#D0C5B0" font-family="Inter" font-size="18">Los párrafos usan color crema apagado, line-height amplio y tamaño legible.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="1090" width="1455" height="410" rx="28" fill="#0C151F" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="136" y="1144" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">COLORES DEL PROYECTO</text>

    <g font-family="Inter">
      <rect x="136" y="1190" width="180" height="110" rx="18" fill="#101922" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="136" y="1330" fill="#F4EFE4" font-size="18" font-weight="800">Base</text>
      <text x="136" y="1360" fill="#D0C5B0" font-size="16">#101922</text>

      <rect x="356" y="1190" width="180" height="110" rx="18" fill="#0C151F" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="356" y="1330" fill="#F4EFE4" font-size="18" font-weight="800">Panel</text>
      <text x="356" y="1360" fill="#D0C5B0" font-size="16">rgba(12,21,31,.9)</text>

      <rect x="576" y="1190" width="180" height="110" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="576" y="1330" fill="#F4EFE4" font-size="18" font-weight="800">Panel suave</text>
      <text x="576" y="1360" fill="#D0C5B0" font-size="16">#101B27</text>

      <rect x="796" y="1190" width="180" height="110" rx="18" fill="#F4EFE4" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="796" y="1330" fill="#F4EFE4" font-size="18" font-weight="800">Texto</text>
      <text x="796" y="1360" fill="#D0C5B0" font-size="16">#F4EFE4</text>

      <rect x="1016" y="1190" width="180" height="110" rx="18" fill="#D0C5B0" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="1016" y="1330" fill="#F4EFE4" font-size="18" font-weight="800">Muted</text>
      <text x="1016" y="1360" fill="#D0C5B0" font-size="16">#D0C5B0</text>

      <rect x="1236" y="1190" width="180" height="110" rx="18" fill="#D6A84F" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="1236" y="1330" fill="#F4EFE4" font-size="18" font-weight="800">Accent home</text>
      <text x="1236" y="1360" fill="#D0C5B0" font-size="16">#D6A84F</text>
    </g>

    <text x="136" y="1440" fill="#D0C5B0" font-family="Inter" font-size="19">Acentos por serie: One Piece #E2AA2F · Naruto #F18F3B · Bleach #7AC7DD · Bordes rgba(255,255,255,.1)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="1550" width="704" height="520" rx="28" fill="#0C151F" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="136" y="1604" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">COMPONENTES</text>
    <text x="136" y="1660" fill="#F4EFE4" font-family="Playfair Display" font-size="40" font-weight="800">Botones y formularios</text>

    <rect x="136" y="1710" width="190" height="54" rx="27" fill="url(#gold)"/>
    <text x="177" y="1744" fill="#101214" font-family="Inter" font-size="16" font-weight="800">Boton principal</text>

    <rect x="350" y="1710" width="190" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="392" y="1744" fill="#F4EFE4" font-family="Inter" font-size="16" font-weight="800">Boton secundario</text>

    <text x="136" y="1816" fill="#D0C5B0" font-family="Inter" font-size="16" font-weight="800">Campo de texto</text>
    <rect x="136" y="1838" width="420" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="160" y="1875" fill="#8F8A80" font-family="Inter" font-size="16">Placeholder del formulario</text>

    <text x="136" y="1948" fill="#D0C5B0" font-family="Inter" font-size="16" font-weight="800">Textarea</text>
    <rect x="136" y="1970" width="420" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="160" y="2008" fill="#8F8A80" font-family="Inter" font-size="16">Contenido largo...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="846" y="1550" width="705" height="520" rx="28" fill="#0C151F" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="890" y="1604" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800" letter-spacing="3">PATRONES DE UI</text>
    <text x="890" y="1660" fill="#F4EFE4" font-family="Playfair Display" font-size="40" font-weight="800">Tarjetas y navegación</text>

    <rect x="890" y="1708" width="580" height="78" rx="39" fill="#050A10" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <circle cx="930" cy="1747" r="21" fill="url(#gold)"/>
    <text x="966" y="1740" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">Los tres grandes</text>
    <text x="966" y="1762" fill="#D0C5B0" font-family="Inter" font-size="12">Anime wiki fan</text>
    <rect x="1230" y="1726" width="90" height="42" rx="21" fill="#D6A84F" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="1250" y="1753" fill="#F4EFE4" font-family="Inter" font-size="14">Inicio</text>

    <rect x="890" y="1828" width="260" height="150" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="920" y="1876" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="800">Anime card</text>
    <text x="920" y="1912" fill="#D0C5B0" font-family="Inter" font-size="16">Imagen arriba, texto abajo, link dorado.</text>
    <text x="920" y="1948" fill="#D6A84F" font-family="Inter" font-size="15" font-weight="800">Abrir portada</text>

    <rect x="1200" y="1828" width="270" height="150" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="1230" y="1876" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="800">Panel info</text>
    <text x="1230" y="1912" fill="#D0C5B0" font-family="Inter" font-size="16">Se usa para permisos, estado, cuenta o ayuda.</text>
  </g>
</svg>
