<svg width="1440" height="1200" viewBox="0 0 1440 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 0) rotate(90) scale(950 1240)">
      <stop stop-color="#1B2A3D"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
    <linearGradient id="mainImage" x1="140" y1="238" x2="1300" y2="528" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121E2B"/>
      <stop offset="0.48" stop-color="#2B4052"/>
      <stop offset="1" stop-color="#0E1721"/>
    </linearGradient>
    <linearGradient id="onePiece" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173146"/>
      <stop offset="1" stop-color="#0E1720"/>
    </linearGradient>
    <linearGradient id="naruto" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4A2412"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="bleach" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#143846"/>
      <stop offset="1" stop-color="#0E1720"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="36" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1440" height="1200" fill="url(#bg)"/>
  <rect width="1440" height="1200" fill="#03070B" opacity="0.28"/>

  <rect x="0" y="0" width="1440" height="96" fill="#050A10" fill-opacity="0.92"/>
  <line x1="0" y1="95.5" x2="1440" y2="95.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <circle cx="76" cy="48" r="28" fill="#0D1722" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="76" cy="48" r="21" fill="url(#gold)"/>
  <circle cx="69" cy="42" r="5" fill="#132130"/>
  <circle cx="83" cy="42" r="5" fill="#132130"/>
  <path d="M67 54C72 62 80 62 86 54" stroke="#132130" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="39" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="700">Los tres grandes</text>
  <text x="120" y="66" fill="#D0C5B0" font-family="Inter" font-size="15">Anime wiki fan</text>

  <g font-family="Inter" font-size="16" font-weight="600">
    <rect x="607" y="28" width="96" height="40" rx="20" fill="#D6A84F" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="628" y="54" fill="#F4EFE4">Portada</text>
    <text x="740" y="54" fill="#D0C5B0">One Piece</text>
    <text x="858" y="54" fill="#D0C5B0">Naruto</text>
    <text x="960" y="54" fill="#D0C5B0">Bleach</text>
  </g>

  <rect x="1190" y="19" width="198" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <circle cx="1220" cy="48" r="20" fill="url(#gold)"/>
  <text x="1214" y="55" fill="#101214" font-family="Inter" font-size="18" font-weight="800">A</text>
  <text x="1256" y="39" fill="#D0C5B0" font-family="Inter" font-size="12">Bienvenido</text>
  <text x="1256" y="60" fill="#F4EFE4" font-family="Inter" font-size="16" font-weight="800">Usuario</text>
  <text x="1360" y="55" fill="#D0C5B0" font-family="Inter" font-size="22" font-weight="800">+</text>

  <g filter="url(#shadow)">
    <rect x="120" y="136" width="1200" height="632" rx="30" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="160" y="190" fill="#D6A84F" font-family="Inter" font-size="15" font-weight="800" letter-spacing="3">PORTADA PRINCIPAL</text>
    <text x="160" y="250" fill="#F4EFE4" font-family="Playfair Display" font-size="62" font-weight="700">Los tres grandes del anime</text>

    <rect x="160" y="292" width="1120" height="274" rx="24" fill="url(#mainImage)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="198" y="334" fill="#D0C5B0" font-family="Inter" font-size="16" font-weight="700">Imagen principal de portada</text>
    <text x="198" y="362" fill="#F4EFE4" font-family="Playfair Display" font-size="34" font-weight="700">Luffy · Naruto · Ichigo</text>
    <text x="198" y="394" fill="#D0C5B0" font-family="Inter" font-size="16">Acceso rapido a los tres universos principales.</text>
    <circle cx="802" cy="432" r="68" fill="#D6A84F" fill-opacity="0.12" stroke="#D6A84F" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="920" cy="432" r="76" fill="#F18F3B" fill-opacity="0.13" stroke="#F18F3B" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1054" cy="432" r="68" fill="#7AC7DD" fill-opacity="0.11" stroke="#7AC7DD" stroke-opacity="0.35" stroke-width="2"/>
    <text x="770" y="438" fill="#F4EFE4" font-family="Playfair Display" font-size="20" font-weight="700">Luffy</text>
    <text x="883" y="438" fill="#F4EFE4" font-family="Playfair Display" font-size="20" font-weight="700">Naruto</text>
    <text x="1022" y="438" fill="#F4EFE4" font-family="Playfair Display" font-size="20" font-weight="700">Ichigo</text>

    <text x="160" y="620" fill="#D0C5B0" font-family="Inter" font-size="19">
      <tspan x="160" dy="0">Explora una portada estilo enciclopedia con acceso rapido a los mundos de One Piece, Naruto y Bleach.</tspan>
      <tspan x="160" dy="34">Cada portada te lleva a sus apartados y cada imagen abre una ficha lista para agregar informacion.</tspan>
    </text>

    <rect x="160" y="684" width="350" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="184" y="710" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800">3 universos</text>
    <text x="184" y="734" fill="#D0C5B0" font-family="Inter" font-size="14">One Piece, Naruto y Bleach reunidos en una sola wiki.</text>

    <rect x="545" y="684" width="350" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="569" y="710" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800">18 apartados</text>
    <text x="569" y="734" fill="#D0C5B0" font-family="Inter" font-size="14">Arcos, clanes, quincys, yonkos y mucho mas.</text>

    <rect x="930" y="684" width="350" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="954" y="710" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="800">Comunidad</text>
    <text x="954" y="734" fill="#D0C5B0" font-family="Inter" font-size="14">Contenido editable y sugerencias para ampliar cada pagina.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="816" width="1200" height="300" rx="30" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="160" y="868" fill="#D6A84F" font-family="Inter" font-size="15" font-weight="800" letter-spacing="3">SERIES DESTACADAS</text>
    <text x="160" y="916" fill="#F4EFE4" font-family="Playfair Display" font-size="40" font-weight="700">Selecciona tu universo favorito</text>

    <rect x="160" y="956" width="350" height="118" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="184" y="978" width="84" height="74" rx="16" fill="url(#onePiece)"/>
    <circle cx="226" cy="1015" r="26" fill="#44535C" stroke="#D6A84F" stroke-opacity="0.5"/>
    <text x="294" y="992" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="700">One Piece</text>
    <text x="294" y="1024" fill="#D0C5B0" font-family="Inter" font-size="14">Arcos, frutas del diablo, mares,</text>
    <text x="294" y="1046" fill="#D0C5B0" font-family="Inter" font-size="14">sichibukais, tripulacion y yonkos.</text>
    <text x="294" y="1068" fill="#D6A84F" font-family="Inter" font-size="13" font-weight="800">Abrir portada</text>

    <rect x="545" y="956" width="350" height="118" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="569" y="978" width="84" height="74" rx="16" fill="url(#naruto)"/>
    <circle cx="611" cy="1015" r="26" fill="#6E3715" stroke="#F18F3B" stroke-opacity="0.55"/>
    <text x="679" y="992" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="700">Naruto</text>
    <text x="679" y="1024" fill="#D0C5B0" font-family="Inter" font-size="14">Equipo 7, ojos, akatsuki,</text>
    <text x="679" y="1046" fill="#D0C5B0" font-family="Inter" font-size="14">bijus, hokages y clanes.</text>
    <text x="679" y="1068" fill="#D6A84F" font-family="Inter" font-size="13" font-weight="800">Abrir portada</text>

    <rect x="930" y="956" width="350" height="118" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="954" y="978" width="84" height="74" rx="16" fill="url(#bleach)"/>
    <circle cx="996" cy="1015" r="26" fill="#263F48" stroke="#7AC7DD" stroke-opacity="0.55"/>
    <text x="1064" y="992" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="700">Bleach</text>
    <text x="1064" y="1024" fill="#D0C5B0" font-family="Inter" font-size="14">Shinigamis, hollows, vizards,</text>
    <text x="1064" y="1046" fill="#D0C5B0" font-family="Inter" font-size="14">quincys, zanpakutos y bankais.</text>
    <text x="1064" y="1068" fill="#D6A84F" font-family="Inter" font-size="13" font-weight="800">Abrir portada</text>
  </g>
</svg>
