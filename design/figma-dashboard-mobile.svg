    <tspan x="19" dy="24">One Piece, Naruto y Bleach. Cada portada te lleva a sus apartados y cada</tspan>
    <tspan x="19" dy="24">imagen abre una ficha lista para que agregues tu propia informacion.</tspan>
  </text>

