  <text x="35" y="829" fill="#D0C5B0" font-family="Inter" font-size="13">Arcos, clanes, quincys, yonkos y mucho mas.</text>

  <rect x="19" y="863" width="352" height="78" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
