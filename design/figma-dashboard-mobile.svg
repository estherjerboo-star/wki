  <text x="288" y="1258" fill="#D6A84F" font-family="Inter" font-size="12" font-weight="800">Abrir</text>

  <rect x="19" y="1286" width="352" height="44" rx="12" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
