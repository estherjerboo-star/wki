<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pageBg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 0) rotate(90) scale(920 1220)">
      <stop stop-color="#1B2A3D"/>
      <stop offset="0.52" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
    <linearGradient id="heroImage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182839"/>
      <stop offset="0.48" stop-color="#2E4355"/>
      <stop offset="1" stop-color="#101923"/>
    </linearGradient>
    <linearGradient id="onePiece" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173146"/>
      <stop offset="1" stop-color="#0E1720"/>
    </linearGradient>
    <linearGradient id="naruto" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4A2412"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="bleach" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#143846"/>
      <stop offset="1" stop-color="#0E1720"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="35" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1440" height="1024" fill="url(#pageBg)"/>
  <rect width="1440" height="1024" fill="#03070B" opacity="0.28"/>

  <rect x="0" y="0" width="1440" height="94" fill="#050A10" fill-opacity="0.9"/>
  <line x1="0" y1="93.5" x2="1440" y2="93.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g transform="translate(52 21)">
    <circle cx="26" cy="26" r="26" fill="#0D1722" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="26" cy="26" r="20" fill="url(#gold)"/>
    <circle cx="19" cy="20" r="5" fill="#132130"/>
    <circle cx="33" cy="20" r="5" fill="#132130"/>
    <path d="M17 31C22.5 39 30.5 39 36 31" stroke="#132130" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="120" y="38" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="25" font-weight="700">Los tres grandes</text>
  <text x="120" y="64" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="15">Anime wiki fan</text>

  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="822" y="27" width="82" height="40" rx="20" fill="#D6A84F" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="842" y="53" fill="#F4EFE4">Inicio</text>
    <text x="947" y="53" fill="#D0C5B0">Iniciar sesion</text>
    <text x="1088" y="53" fill="#D0C5B0">Crear cuenta</text>
  </g>

  <main>
    <g filter="url(#panelShadow)">
      <rect x="120" y="132" width="1200" height="502" rx="30" fill="#0C151F" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <rect x="160" y="172" width="1120" height="284" rx="24" fill="url(#heroImage)" stroke="#FFFFFF" stroke-opacity="0.08"/>

      <text x="170" y="213" fill="#D6A84F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3">PORTAL PRINCIPAL</text>
      <text x="170" y="270" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">Los tres grandes</text>
      <text x="170" y="332" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="700">del anime</text>

      <circle cx="888" cy="314" r="80" fill="#5E4B3C" stroke="#D6A84F" stroke-opacity="0.42" stroke-width="2"/>
      <circle cx="792" cy="326" r="62" fill="#D6A84F" fill-opacity="0.08" stroke="#D6A84F" stroke-opacity="0.25"/>
      <circle cx="984" cy="326" r="62" fill="#7AC7DD" fill-opacity="0.08" stroke="#7AC7DD" stroke-opacity="0.25"/>
      <text x="817" y="420" fill="#D6A84F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">LUFFY · NARUTO · ICHIGO</text>

      <text x="170" y="506" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="19">
        <tspan x="170" dy="0">Entra a una portada inspirada en una enciclopedia visual de One Piece, Naruto y Bleach.</tspan>
        <tspan x="170" dy="34">Descubre sus mundos, personajes y categorias principales desde una portada visual clara y directa.</tspan>
      </text>

      <rect x="170" y="570" width="150" height="48" rx="24" fill="url(#gold)"/>
      <text x="200" y="601" fill="#101214" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Iniciar sesion</text>
      <rect x="336" y="570" width="142" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="366" y="601" fill="#F4EFE4" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">Crear cuenta</text>
    </g>

    <g filter="url(#panelShadow)">
      <rect x="120" y="672" width="1200" height="286" rx="30" fill="#0C151F" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="160" y="722" fill="#D6A84F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3">SERIES DESTACADAS</text>
      <text x="160" y="769" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="38" font-weight="700">Explora el universo que prefieras</text>

      <g>
        <rect x="160" y="806" width="350" height="120" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <rect x="182" y="826" width="84" height="80" rx="16" fill="url(#onePiece)"/>
        <circle cx="224" cy="866" r="28" fill="#44535C" stroke="#D6A84F" stroke-opacity="0.5"/>
        <text x="292" y="848" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700">One Piece</text>
        <text x="292" y="878" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="14">Arcos, frutas del diablo, mares,</text>
        <text x="292" y="900" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="14">sichibukais, tripulacion y yonkos.</text>
        <text x="292" y="920" fill="#D6A84F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Abrir portada</text>
      </g>

      <g>
        <rect x="545" y="806" width="350" height="120" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <rect x="567" y="826" width="84" height="80" rx="16" fill="url(#naruto)"/>
        <circle cx="609" cy="866" r="28" fill="#6E3715" stroke="#F18F3B" stroke-opacity="0.55"/>
        <text x="677" y="848" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700">Naruto</text>
        <text x="677" y="878" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="14">Equipo 7, ojos, akatsuki,</text>
        <text x="677" y="900" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="14">bijus, hokages y clanes.</text>
        <text x="677" y="920" fill="#D6A84F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Abrir portada</text>
      </g>

      <g>
        <rect x="930" y="806" width="350" height="120" rx="24" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <rect x="952" y="826" width="84" height="80" rx="16" fill="url(#bleach)"/>
        <circle cx="994" cy="866" r="28" fill="#263F48" stroke="#7AC7DD" stroke-opacity="0.55"/>
        <text x="1062" y="848" fill="#F4EFE4" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="700">Bleach</text>
        <text x="1062" y="878" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="14">Shinigamis, hollows, vizards,</text>
        <text x="1062" y="900" fill="#D0C5B0" font-family="Inter, Arial, sans-serif" font-size="14">quincys, zanpakutos y bankais.</text>
        <text x="1062" y="920" fill="#D6A84F" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">Abrir portada</text>
      </g>
    </g>
  </main>

  <circle cx="1368" cy="944" r="28" fill="url(#gold)"/>
  <text x="1358" y="954" fill="#101214" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">↑</text>
</svg>
