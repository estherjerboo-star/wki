  <text x="105" y="652" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">Roles del sistema</text>
  <text x="105" y="678" fill="#D0C5B0" font-family="Inter" font-size="13">Administrador, editor y usuario.</text>

  <rect x="19" y="714" width="352" height="70" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
