    <tspan x="19" dy="22">El administrador edita, mete y borra contenido y usuarios.</tspan>
  </text>
  <text x="19" y="552" fill="#D6A84F" font-family="Inter" font-size="13" font-weight="800">Volver a la portada principal</text>

