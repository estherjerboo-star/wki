  <text x="105" y="837" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">Panel central de control</text>

  <rect x="4" y="908" width="382" height="560" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
