  <text x="19" y="426" fill="#D6A84F" font-family="Inter" font-size="11" font-weight="800" letter-spacing="3">PANEL ABIERTO CON CONTROL POR ROLES</text>
  <text x="19" y="466" fill="#F4EFE4" font-family="Playfair Display" font-size="30" font-weight="800">Gestion de contenido y usuarios</text>
