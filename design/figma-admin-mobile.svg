      <stop stop-color="#172536"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
    <linearGradient id="cover" x1="15" y1="216" x2="375" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22251F"/>
      <stop offset="0.45" stop-color="#1C252D"/>
      <stop offset="1" stop-color="#102231"/>
    </linearGradient>
  </defs>

  <rect width="390" height="2100" fill="#E6E6E6"/>
  <rect width="390" height="2100" fill="url(#bg)"/>
  <rect width="390" height="2100" fill="#03070B" opacity="0.25"/>

  <rect width="390" height="177" fill="#050A10" fill-opacity="0.95"/>
  <line x1="0" y1="176.5" x2="390" y2="176.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <circle cx="31" cy="28" r="18" fill="#0D1722" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="31" cy="28" r="13" fill="url(#gold)"/>
  <text x="25" y="34" fill="#101214" font-family="Inter" font-size="14" font-weight="900">3</text>
  <text x="57" y="24" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="800">Los tres grandes</text>
  <text x="57" y="43" fill="#D0C5B0" font-family="Inter" font-size="11">Anime wiki fan</text>

  <g font-family="Inter" font-size="13" font-weight="600">
