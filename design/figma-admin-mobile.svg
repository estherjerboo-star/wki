    <text x="189" y="90" fill="#D0C5B0">Naruto</text>
    <text x="253" y="90" fill="#D0C5B0">Bleach</text>
  </g>

  <rect x="15" y="116" width="360" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <circle cx="39" cy="139" r="17" fill="url(#gold)"/>
  <text x="33" y="145" fill="#101214" font-family="Inter" font-size="16" font-weight="900">A</text>
  <text x="69" y="133" fill="#D0C5B0" font-family="Inter" font-size="10">Bienvenido</text>
  <text x="69" y="150" fill="#F4EFE4" font-family="Inter" font-size="15" font-weight="800">Administrador</text>
  <text x="352" y="146" fill="#D0C5B0" font-family="Inter" font-size="20" font-weight="900">+</text>

