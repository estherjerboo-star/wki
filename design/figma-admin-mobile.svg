  <text x="19" y="1576" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="800">Mensajes de usuarios</text>
  <text x="19" y="1614" fill="#D0C5B0" font-family="Inter" font-size="13">Los usuarios envian sugerencias y solicitudes desde cada pagina.</text>

  <rect x="19" y="1650" width="352" height="58" rx="14" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="39" y="1675" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">Solicitud recibida</text>
  <text x="39" y="1696" fill="#D0C5B0" font-family="Inter" font-size="10">Mensaje enviado por un usuario.</text>

  <text x="19" y="1760" fill="#D6A84F" font-family="Inter" font-size="11" font-weight="800" letter-spacing="3">USUARIOS</text>
  <text x="19" y="1794" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="800">Roles y cuentas</text>

  <rect x="4" y="1824" width="382" height="210" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="19" y="1852" width="352" height="58" rx="14" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="39" y="1877" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">Usuario / Rol</text>
  <text x="39" y="1898" fill="#D0C5B0" font-family="Inter" font-size="10">Cuenta registrada y rol actual.</text>
  <rect x="19" y="1924" width="352" height="58" rx="14" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="39" y="1949" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">Usuario / Rol</text>
  <text x="39" y="1970" fill="#D0C5B0" font-family="Inter" font-size="10">Otra cuenta registrada.</text>
