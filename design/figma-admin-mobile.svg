  <text x="39" y="1242" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">Contenido</text>
  <rect x="39" y="1262" width="312" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="55" y="1290" fill="#8F8A80" font-family="Inter" font-size="10">Escribe aqui el contenido que quieres publicar.</text>

  <rect x="39" y="1348" width="124" height="34" rx="17" fill="url(#gold)"/>
  <text x="61" y="1370" fill="#101214" font-family="Inter" font-size="11" font-weight="800">Guardar contenido</text>
  <rect x="176" y="1348" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="197" y="1370" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Cancelar edicion</text>

  <text x="19" y="1428" fill="#D6A84F" font-family="Inter" font-size="11" font-weight="800" letter-spacing="3">ENTRADAS PUBLICADAS</text>
