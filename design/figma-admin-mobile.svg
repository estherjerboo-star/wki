  <text x="105" y="768" fill="#D0C5B0" font-family="Inter" font-size="13">Contenido y administracion.</text>

  <rect x="19" y="804" width="352" height="58" rx="15" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
