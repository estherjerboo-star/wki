<svg width="390" height="1160" viewBox="0 0 390 1160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(195 0) rotate(90) scale(820 430)">
      <stop stop-color="#172536"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
  </defs>

  <rect width="390" height="1160" fill="#E6E6E6"/>
  <rect width="390" height="1160" fill="url(#bg)"/>
  <rect width="390" height="1160" fill="#03070B" opacity="0.25"/>

  <rect x="8" y="24" width="374" height="604" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="28" y="64" fill="#D6A84F" font-family="Inter" font-size="10" font-weight="800" letter-spacing="1.8">WIKI ABIERTA</text>
  <text x="28" y="100" fill="#F4EFE4" font-family="Playfair Display" font-size="27" font-weight="800">Contenido de la comunidad</text>
  <text x="28" y="138" fill="#D0C5B0" font-family="Inter" font-size="13">
    <tspan x="28" dy="0">Esta pagina es publica. Todo el mundo puede leerla, y los</tspan>
    <tspan x="28" dy="22">usuarios con rol editor o administrador pueden anadir y</tspan>
    <tspan x="28" dy="22">modificar contenido.</tspan>
  </text>

  <rect x="28" y="214" width="334" height="244" rx="16" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="48" y="250" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">Titulo del contenido</text>
  <rect x="48" y="270" width="294" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="66" y="294" fill="#8F8A80" font-family="Inter" font-size="10">Ejemplo: Curiosidades del apartado</text>

  <text x="48" y="344" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">Contenido</text>
  <rect x="48" y="364" width="294" height="82" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="66" y="390" fill="#8F8A80" font-family="Inter" font-size="10">Escribe aqui el contenido que quieres publicar o modificar.</text>

  <rect x="48" y="482" width="118" height="34" rx="17" fill="url(#gold)"/>
  <text x="70" y="504" fill="#101214" font-family="Inter" font-size="11" font-weight="800">Guardar contenido</text>
  <rect x="178" y="482" width="118" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="199" y="504" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Cancelar edicion</text>

  <rect x="28" y="546" width="334" height="58" rx="14" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="48" y="571" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Aun no hay contenido extra en esta pagina</text>
  <text x="48" y="592" fill="#D0C5B0" font-family="Inter" font-size="10">Puedes publicar el primer aporte desde el formulario superior.</text>

  <rect x="8" y="654" width="374" height="192" rx="20" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="28" y="694" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="800">Permisos activos</text>
  <text x="28" y="740" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">• Administrador:</text>
  <text x="50" y="764" fill="#D0C5B0" font-family="Inter" font-size="11">puede meter, editar y borrar contenido, y tambien</text>
  <text x="50" y="784" fill="#D0C5B0" font-family="Inter" font-size="11">borrar usuarios desde el panel.</text>
  <text x="28" y="820" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">• Usuario editor:</text>
  <text x="50" y="842" fill="#D0C5B0" font-family="Inter" font-size="11">puede meter y modificar contenido.</text>

  <rect x="8" y="872" width="374" height="82" rx="18" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="28" y="910" fill="#F4EFE4" font-family="Playfair Display" font-size="22" font-weight="800">Visibilidad</text>
  <text x="28" y="936" fill="#D0C5B0" font-family="Inter" font-size="11">Este bloque solo aparece para editor y administrador.</text>

  <rect x="8" y="980" width="374" height="82" rx="18" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="28" y="1018" fill="#F4EFE4" font-family="Playfair Display" font-size="22" font-weight="800">Autor</text>
  <text x="28" y="1044" fill="#D0C5B0" font-family="Inter" font-size="11">Cada publicacion muestra quien la ha escrito y su fecha.</text>

  <rect x="8" y="1088" width="374" height="58" rx="18" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="28" y="1124" fill="#F4EFE4" font-family="Playfair Display" font-size="22" font-weight="800">Panel</text>
  <text x="118" y="1124" fill="#D0C5B0" font-family="Inter" font-size="11">Revisa solicitudes recibidas.</text>
</svg>
