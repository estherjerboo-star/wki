    <text x="640" y="430" fill="#101214" font-family="Playfair Display" font-size="20" font-weight="800">Ichigo</text>

    <text x="47" y="683" fill="#D0C5B0" font-family="Inter" font-size="16">
      <tspan x="47" dy="0">Explora una portada estilo enciclopedia con acceso rapido a los mundos de One Piece, Naruto y Bleach. Cada portada te lleva</tspan>
      <tspan x="47" dy="28">a sus apartados y cada imagen abre una ficha lista para que agregues tu propia informacion.</tspan>
    </text>

    <rect x="48" y="738" width="847" height="78" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="64" y="768" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="900">3 universos</text>
    <text x="64" y="796" fill="#D0C5B0" font-family="Inter" font-size="15">One Piece, Naruto y Bleach reunidos en una sola wiki.</text>

    <rect x="48" y="830" width="847" height="78" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="64" y="860" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="900">18 apartados</text>
    <text x="64" y="888" fill="#D0C5B0" font-family="Inter" font-size="15">Arcos, clanes, quincys, yonkos y mucho mas para recorrer.</text>

    <rect x="48" y="922" width="847" height="78" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="64" y="952" fill="#D6A84F" font-family="Inter" font-size="16" font-weight="900">Comunidad</text>
