<svg width="1440" height="1600" viewBox="0 0 1440 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 0) rotate(90) scale(1200 1400)">
      <stop stop-color="#203044"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#E2AA2F"/>
    </linearGradient>
    <linearGradient id="cover" x1="120" y1="140" x2="1320" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#173146"/>
      <stop offset="0.48" stop-color="#2D4658"/>
      <stop offset="1" stop-color="#111A24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="36" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1440" height="1600" fill="url(#bg)"/>
  <rect width="1440" height="1600" fill="#03070B" opacity="0.28"/>

  <rect width="1440" height="96" fill="#050A10" fill-opacity="0.92"/>
  <line x1="0" y1="95.5" x2="1440" y2="95.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <circle cx="76" cy="48" r="28" fill="#0D1722" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <circle cx="76" cy="48" r="21" fill="url(#gold)"/>
  <circle cx="69" cy="42" r="5" fill="#132130"/>
  <circle cx="83" cy="42" r="5" fill="#132130"/>
  <path d="M67 54C72 62 80 62 86 54" stroke="#132130" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="39" fill="#F4EFE4" font-family="Playfair Display" font-size="26" font-weight="700">Los tres grandes</text>
  <text x="120" y="66" fill="#D0C5B0" font-family="Inter" font-size="15">Anime wiki fan</text>

  <g font-family="Inter" font-size="16" font-weight="600">
    <text x="610" y="54" fill="#D0C5B0">Portada</text>
    <rect x="708" y="28" width="116" height="40" rx="20" fill="#E2AA2F" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="730" y="54" fill="#F4EFE4">One Piece</text>
    <text x="858" y="54" fill="#D0C5B0">Naruto</text>
    <text x="960" y="54" fill="#D0C5B0">Bleach</text>
  </g>

  <rect x="1190" y="19" width="198" height="58" rx="29" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <circle cx="1220" cy="48" r="20" fill="url(#gold)"/>
  <text x="1214" y="55" fill="#101214" font-family="Inter" font-size="18" font-weight="800">A</text>
  <text x="1256" y="39" fill="#D0C5B0" font-family="Inter" font-size="12">Bienvenido</text>
  <text x="1256" y="60" fill="#F4EFE4" font-family="Inter" font-size="16" font-weight="800">Usuario</text>
  <text x="1360" y="55" fill="#D0C5B0" font-family="Inter" font-size="22" font-weight="800">+</text>

  <g filter="url(#shadow)">
    <rect x="120" y="136" width="1200" height="456" rx="30" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="160" y="176" width="1120" height="210" rx="24" fill="url(#cover)" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="198" y="224" fill="#D0C5B0" font-family="Inter" font-size="16" font-weight="700">Imagen: Arcos de One Piece</text>
    <text x="198" y="266" fill="#F4EFE4" font-family="Playfair Display" font-size="44" font-weight="700">Sagas y arcos del viaje</text>
    <text x="198" y="306" fill="#D0C5B0" font-family="Inter" font-size="16">East Blue, Grand Line, Nuevo Mundo y Saga Final.</text>
    <circle cx="930" cy="282" r="70" fill="#E2AA2F" fill-opacity="0.14" stroke="#E2AA2F" stroke-opacity="0.4" stroke-width="2"/>
    <text x="890" y="290" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="700">Arcos</text>

    <text x="160" y="444" fill="#E2AA2F" font-family="Inter" font-size="15" font-weight="800" letter-spacing="3">ONE PIECE</text>
    <text x="160" y="494" fill="#F4EFE4" font-family="Playfair Display" font-size="56" font-weight="700">Arcos de One Piece</text>
    <text x="160" y="542" fill="#D0C5B0" font-family="Inter" font-size="18">
      <tspan x="160" dy="0">One Piece se organiza en sagas y arcos que muestran como Luffy pasa de pirata novato</tspan>
      <tspan x="160" dy="30">a una figura capaz de sacudir el equilibrio del mundo.</tspan>
    </text>
    <text x="1120" y="548" fill="#E2AA2F" font-family="Inter" font-size="16" font-weight="800">Volver a One Piece</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="632" width="370" height="118" rx="22" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="154" y="690" fill="#E2AA2F" font-family="Playfair Display" font-size="42" font-weight="700">11</text>
    <text x="234" y="676" fill="#F4EFE4" font-family="Inter" font-size="17" font-weight="800">Sagas principales</text>
    <text x="234" y="706" fill="#D0C5B0" font-family="Inter" font-size="15">Desde East Blue hasta la Saga Final.</text>

    <rect x="535" y="632" width="370" height="118" rx="22" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="569" y="690" fill="#E2AA2F" font-family="Playfair Display" font-size="42" font-weight="700">33</text>
    <text x="659" y="676" fill="#F4EFE4" font-family="Inter" font-size="17" font-weight="800">Arcos destacados</text>
    <text x="659" y="706" fill="#D0C5B0" font-family="Inter" font-size="15">La evolucion de los Sombrero de Paja.</text>

    <rect x="950" y="632" width="370" height="118" rx="22" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="984" y="690" fill="#E2AA2F" font-family="Playfair Display" font-size="42" font-weight="700">2</text>
    <text x="1054" y="676" fill="#F4EFE4" font-family="Inter" font-size="17" font-weight="800">Grandes etapas</text>
    <text x="1054" y="706" fill="#D0C5B0" font-family="Inter" font-size="15">Antes del timeskip y Nuevo Mundo.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="790" width="760" height="692" rx="30" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="160" y="842" fill="#E2AA2F" font-family="Inter" font-size="15" font-weight="800" letter-spacing="3">GUIA GENERAL</text>
    <text x="160" y="892" fill="#F4EFE4" font-family="Playfair Display" font-size="42" font-weight="700">Como se construye la aventura de Luffy</text>
    <text x="160" y="942" fill="#D0C5B0" font-family="Inter" font-size="17">
      <tspan x="160" dy="0">Los arcos no solo encadenan combates. Cada uno presenta un problema local conectado con algo mayor:</tspan>
      <tspan x="160" dy="28">el Gobierno Mundial, los Yonkos, los poneglyphs, el Siglo Vacio o la lucha por la libertad.</tspan>
    </text>

    <rect x="160" y="1008" width="680" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="184" y="1035" fill="#D0C5B0" font-family="Inter" font-size="15">• Las primeras sagas forman la tripulacion y abren la entrada a la Grand Line.</text>
    <text x="184" y="1062" fill="#D0C5B0" font-family="Inter" font-size="15">• Tras el timeskip, el foco pasa a alianzas, emperadores y Road Poneglyphs.</text>

    <text x="160" y="1142" fill="#F4EFE4" font-family="Playfair Display" font-size="30" font-weight="700">Sagas y arcos principales</text>

    <g font-family="Inter">
      <rect x="160" y="1180" width="314" height="92" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="184" y="1212" fill="#E2AA2F" font-size="13" font-weight="800" letter-spacing="1.5">SAGA EAST BLUE</text>
      <text x="184" y="1240" fill="#F4EFE4" font-family="Playfair Display" font-size="21" font-weight="700">Los origenes</text>
      <text x="388" y="1212" fill="#D0C5B0" font-size="13">6 arcos</text>
      <text x="184" y="1262" fill="#D0C5B0" font-size="13">Romance Dawn, Orange Town, Baratie...</text>

      <rect x="526" y="1180" width="314" height="92" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="550" y="1212" fill="#E2AA2F" font-size="13" font-weight="800" letter-spacing="1.5">SAGA ARABASTA</text>
      <text x="550" y="1240" fill="#F4EFE4" font-family="Playfair Display" font-size="21" font-weight="700">La Grand Line</text>
      <text x="754" y="1212" fill="#D0C5B0" font-size="13">5 arcos</text>
      <text x="550" y="1262" fill="#D0C5B0" font-size="13">Vivi, Baroque Works y Crocodile.</text>

      <rect x="160" y="1300" width="314" height="92" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="184" y="1332" fill="#E2AA2F" font-size="13" font-weight="800" letter-spacing="1.5">SAGA WATER 7</text>
      <text x="184" y="1360" fill="#F4EFE4" font-family="Playfair Display" font-size="21" font-weight="700">Robin y Enies Lobby</text>
      <text x="388" y="1332" fill="#D0C5B0" font-size="13">4 arcos</text>
      <text x="184" y="1382" fill="#D0C5B0" font-size="13">La tripulacion se rompe y vuelve mas fuerte.</text>

      <rect x="526" y="1300" width="314" height="92" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="550" y="1332" fill="#E2AA2F" font-size="13" font-weight="800" letter-spacing="1.5">MARINEFORD</text>
      <text x="550" y="1360" fill="#F4EFE4" font-family="Playfair Display" font-size="21" font-weight="700">La guerra total</text>
      <text x="754" y="1332" fill="#D0C5B0" font-size="13">5 arcos</text>
      <text x="550" y="1382" fill="#D0C5B0" font-size="13">Sabaody, Impel Down, Ace y el fin de una era.</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="790" width="400" height="692" rx="30" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="960" y="842" fill="#F4EFE4" font-family="Playfair Display" font-size="30" font-weight="700">Claves para entender los arcos</text>
    <text x="960" y="892" fill="#D0C5B0" font-family="Inter" font-size="15">• Cada saga agrupa arcos conectados por un conflicto mayor.</text>
    <text x="960" y="924" fill="#D0C5B0" font-family="Inter" font-size="15">• Las islas reflejan libertad, justicia, racismo o herencia.</text>
    <text x="960" y="956" fill="#D0C5B0" font-family="Inter" font-size="15">• Muchos personajes reaparecen con mayor importancia.</text>
    <text x="960" y="988" fill="#D0C5B0" font-family="Inter" font-size="15">• Las consecuencias vuelven a importar mas adelante.</text>

    <rect x="960" y="1048" width="320" height="142" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="984" y="1082" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="700">Arcos decisivos</text>
    <text x="984" y="1120" fill="#D0C5B0" font-family="Inter" font-size="14">Arlong Park, Arabasta, Enies Lobby,</text>
    <text x="984" y="1144" fill="#D0C5B0" font-family="Inter" font-size="14">Marineford, Wano y Egghead.</text>
    <text x="984" y="1172" fill="#E2AA2F" font-family="Inter" font-size="14" font-weight="800">Momentos clave de la obra</text>

    <rect x="960" y="1230" width="320" height="198" rx="18" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="984" y="1264" fill="#F4EFE4" font-family="Playfair Display" font-size="24" font-weight="700">Metadatos</text>
    <text x="984" y="1302" fill="#D0C5B0" font-family="Inter" font-size="15">Serie: One Piece</text>
    <text x="984" y="1332" fill="#D0C5B0" font-family="Inter" font-size="15">Apartado: Arcos</text>
    <text x="984" y="1362" fill="#D0C5B0" font-family="Inter" font-size="15">Sagas listadas: 11</text>
    <text x="984" y="1392" fill="#D0C5B0" font-family="Inter" font-size="15">Arcos listados: 33</text>
  </g>
</svg>
