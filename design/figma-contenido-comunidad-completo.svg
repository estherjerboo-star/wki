<svg width="1016" height="1388" viewBox="0 0 1016 1388" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(508 60) rotate(90) scale(860 980)">
      <stop stop-color="#172536"/>
      <stop offset="0.55" stop-color="#0B121A"/>
      <stop offset="1" stop-color="#05090D"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F0D38E"/>
      <stop offset="1" stop-color="#D6A84F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1016" height="1388" fill="#E6E6E6"/>
  <rect x="8" y="10" width="1000" height="1350" fill="url(#bg)"/>
  <rect x="8" y="10" width="1000" height="1350" fill="#03070B" opacity="0.25"/>

  <rect x="18" y="18" width="980" height="60" rx="14" fill="#050A10" fill-opacity="0.94" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="62" cy="48" r="18" fill="#0D1722" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="57" y="54" fill="#D6A84F" font-family="Inter" font-size="15" font-weight="800">3</text>
  <text x="94" y="39" fill="#F4EFE4" font-family="Playfair Display" font-size="16" font-weight="700">Los tres grandes</text>
  <text x="94" y="58" fill="#D0C5B0" font-family="Inter" font-size="10">Anime wiki fan</text>

  <g font-family="Inter" font-size="11" font-weight="600">
    <text x="337" y="51" fill="#D0C5B0">Portada</text>
    <rect x="390" y="29" width="78" height="35" rx="17.5" fill="#D6A84F" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="408" y="51" fill="#F4EFE4">One Piece</text>
    <text x="490" y="51" fill="#D0C5B0">Naruto</text>
    <text x="550" y="51" fill="#D0C5B0">Bleach</text>
  </g>

  <rect x="783" y="28" width="166" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <circle cx="804" cy="47" r="14" fill="url(#gold)"/>
  <text x="799" y="52" fill="#101214" font-family="Inter" font-size="13" font-weight="800">A</text>
  <text x="832" y="42" fill="#D0C5B0" font-family="Inter" font-size="9">Bienvenido</text>
  <text x="832" y="56" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Usuario</text>
  <text x="925" y="53" fill="#D0C5B0" font-family="Inter" font-size="15" font-weight="800">+</text>

  <g filter="url(#shadow)">
    <rect x="94" y="406" width="486" height="642" rx="18" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="116" y="448" fill="#D6A84F" font-family="Inter" font-size="10" font-weight="800" letter-spacing="1.8">WIKI ABIERTA</text>
    <text x="116" y="486" fill="#F4EFE4" font-family="Playfair Display" font-size="34" font-weight="700">Contenido de la comunidad</text>
    <text x="116" y="524" fill="#D0C5B0" font-family="Inter" font-size="13">
      <tspan x="116" dy="0">Esta pagina es publica. Todo el mundo puede leerla, y los usuarios con rol</tspan>
      <tspan x="116" dy="20">editor o administrador pueden anadir y modificar contenido.</tspan>
    </text>

    <rect x="116" y="560" width="448" height="260" rx="16" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="138" y="599" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Titulo del contenido</text>
    <rect x="138" y="617" width="398" height="39" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="158" y="642" fill="#8F8A80" font-family="Inter" font-size="11">Ejemplo: Curiosidades del apartado</text>

    <text x="138" y="693" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Contenido</text>
    <rect x="138" y="711" width="398" height="108" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="158" y="737" fill="#8F8A80" font-family="Inter" font-size="11">Escribe aqui el contenido que quieres publicar o modificar.</text>

    <rect x="138" y="843" width="124" height="32" rx="16" fill="url(#gold)"/>
    <text x="161" y="864" fill="#101214" font-family="Inter" font-size="11" font-weight="800">Guardar contenido</text>
    <rect x="274" y="843" width="112" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="294" y="864" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Cancelar edicion</text>

    <rect x="116" y="890" width="448" height="68" rx="12" fill="#101B27" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="138" y="917" fill="#F4EFE4" font-family="Inter" font-size="11" font-weight="800">Aun no hay contenido extra en esta pagina</text>
    <text x="138" y="942" fill="#D0C5B0" font-family="Inter" font-size="11">Puedes publicar el primer aporte desde el formulario superior.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="596" y="422" width="330" height="268" rx="16" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="622" y="461" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="700">Permisos activos</text>
    <text x="622" y="508" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">• Administrador:</text>
    <text x="645" y="532" fill="#D0C5B0" font-family="Inter" font-size="11">puede meter, editar y borrar contenido, y tambien</text>
    <text x="645" y="550" fill="#D0C5B0" font-family="Inter" font-size="11">borrar usuarios desde el panel.</text>
    <text x="622" y="591" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">• Usuario editor:</text>
    <text x="645" y="615" fill="#D0C5B0" font-family="Inter" font-size="11">puede meter y modificar contenido.</text>
    <text x="622" y="656" fill="#F4EFE4" font-family="Inter" font-size="12" font-weight="800">• Solicitudes:</text>
    <text x="645" y="680" fill="#D0C5B0" font-family="Inter" font-size="11">las propuestas de usuarios registrados se revisan</text>
    <text x="645" y="698" fill="#D0C5B0" font-family="Inter" font-size="11">desde el panel de contenido.</text>

    <rect x="596" y="716" width="330" height="90" rx="16" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="622" y="755" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="700">Visibilidad</text>
    <text x="622" y="785" fill="#D0C5B0" font-family="Inter" font-size="11">Este bloque solo aparece para editor y administrador.</text>

    <rect x="596" y="830" width="330" height="90" rx="16" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="622" y="869" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="700">Autor</text>
    <text x="622" y="899" fill="#D0C5B0" font-family="Inter" font-size="11">Cada publicacion muestra quien la ha escrito y su fecha.</text>

    <rect x="596" y="944" width="330" height="98" rx="16" fill="#0C151F" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="622" y="983" fill="#F4EFE4" font-family="Playfair Display" font-size="18" font-weight="700">Panel</text>
    <text x="622" y="1013" fill="#D0C5B0" font-family="Inter" font-size="11">Puedes revisar tambien las solicitudes recibidas en el</text>
    <text x="622" y="1031" fill="#D0C5B0" font-family="Inter" font-size="11">panel de contenido.</text>
  </g>

  <rect x="20" y="1302" width="106" height="38" rx="19" fill="#0C151F" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="38" y="1326" fill="#F4EFE4" font-family="Inter" font-size="14" font-weight="800">♟ Audio</text>

  <circle cx="956" cy="1310" r="19" fill="url(#gold)"/>
  <text x="949" y="1317" fill="#101214" font-family="Inter" font-size="18" font-weight="900">↑</text>
</svg>
